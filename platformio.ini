[platformio]
; Keep the hardware-verified 4 MB-layout environment as default.
; 16 MB candidate is BUILD / AUDIT ONLY, never upload it without migration plan.
default_envs = infotab_tab5

; InfoTAB - M5Stack Tab5 / ESP32-P4
; Na podstawie oficjalnego przykładu PlatformIO M5Stack Tab5:
; https://docs.m5stack.com/en/core/Tab5
; Wersja startowa: kompilacja i flash przez USB-C (COM6).
; Nie uruchamiaj OTA, dopóki nie będzie przygotowanych partycji i rollbacku.

[env:infotab_tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio

; Use esptool provided by platform-espressif32#54.03.21 itself.
; Its platform.json points to pioarduino/esptool v5.0.0-dev1.
; Do NOT set platform_packages: registry pin 5.0.0 is unresolved and
; the alternative 5.0.2 ZIP lacks the esptool.py legacy entry point.
; For compatibility with Click >= 8.2 run scripts/build-windows.ps1.

upload_port = COM6
monitor_port = COM6
upload_speed = 1500000
monitor_speed = 115200

; Disable verbose framework logs to avoid exposing sensitive network diagnostics.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git

; Candidate for full 16 MB Flash: only build and analyze its generated partitions.
; DO NOT UPLOAD this environment to the Tab5 until NVS backup,
; partition migration and USB recovery steps are approved and tested.
[env:infotab_tab5_16mb_audit]
extends = env:infotab_tab5
board_build.partitions = partitions/infotab_16mb.csv
