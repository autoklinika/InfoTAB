; InfoTAB - M5Stack Tab5 / ESP32-P4
; Na podstawie oficjalnego przykładu PlatformIO M5Stack Tab5:
; https://docs.m5stack.com/en/core/Tab5
; Wersja startowa: kompilacja i flash przez USB-C (COM6).
; Nie uruchamiaj OTA, dopóki nie będzie przygotowanych partycji i rollbacku.

[env:infotab_tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio

; The pinned pioarduino platform expects a legacy esptool.py entrypoint.
; Do not override tool-esptoolpy with v5.0.2 ZIP (missing that path).
; For esptool 5.0.0 and Click >= 8.2 use: scripts/build-windows.ps1

upload_port = COM6
monitor_port = COM6
upload_speed = 1500000
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
