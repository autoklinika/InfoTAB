name: Firmware Build - InfoTAB

on:
  push:
    branches:
      - feature/initial-platformio-tab5
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax (all Windows scripts)
        shell: pwsh
        run: ./scripts/check-powershell-syntax.ps1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and compatible Click
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio>=6.1,<7" "click==8.1.8"

      - name: Compile Tab5 firmware
        run: pio run -e infotab_tab5
